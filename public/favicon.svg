<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="rs-turf" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="rs-glow" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Base Squircle Container -->
  <rect width="40" height="40" rx="10" fill="url(#rs-turf)" />
  <!-- Gloss highlight overlay -->
  <rect width="40" height="20" rx="10" fill="url(#rs-glow)" />
  
  <!-- Sports Court Outer Boundary Line -->
  <rect x="8" y="6" width="24" height="28" rx="2.5" stroke="#FFFFFF" stroke-width="1.75" stroke-opacity="0.95" />
  
  <!-- Center Half-Court Line -->
  <line x1="8" y1="20" x2="32" y2="20" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9" />
  
  <!-- Center Circle -->
  <circle cx="20" cy="20" r="4.5" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9" />
  
  <!-- Top Goal / Service Box -->
  <path d="M13 6v5.5h14V6" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity="0.85" stroke-linejoin="round" />
  
  <!-- Bottom Goal / Service Box -->
  <path d="M13 34v-5.5h14V34" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity="0.85" stroke-linejoin="round" />
  
  <!-- Center Spot / Match Active Indicator (Amber Accent) -->
  <circle cx="20" cy="20" r="1.6" fill="#FBBF24" />
</svg>
